<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d8def5"/></marker></defs>
<rect width="960" height="540" fill="#0b0d17"/><text x="40" y="48" font-size="34" fill="#ff5fa2" text-anchor="start" font-weight="bold" opacity="1">01</text><text x="92" y="40" font-size="22" fill="#d8def5" text-anchor="start" font-weight="bold" opacity="1">System overview</text><text x="92" y="62" font-size="13" fill="#d8def5" text-anchor="start" font-weight="normal" opacity="0.7">audio in, MIDI out, loop back</text><rect x="40" y="130" width="200" height="54" rx="10" fill="#11142a" stroke="#4fd1ff" stroke-width="2"/><text x="140.0" y="157.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Mic / audio clip</text><text x="140.0" y="175.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">conditioning audio</text><rect x="40" y="200" width="200" height="54" rx="10" fill="#11142a" stroke="#4fd1ff" stroke-width="2"/><text x="140.0" y="227.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Drawn / played MIDI</text><text x="140.0" y="245.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">optional MIDI context</text><rect x="40" y="270" width="200" height="54" rx="10" fill="#11142a" stroke="#ffc857" stroke-width="2"/><text x="140.0" y="297.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Touchpad, sensors, OCR</text><text x="140.0" y="315.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">control inputs</text><rect x="340" y="190" width="220" height="80" rx="10" fill="#11142a" stroke="#d8def5" stroke-width="2"/><text x="450.0" y="230.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">p5.js app</text><text x="450.0" y="248.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">radial sequencer + viz</text><rect x="640" y="130" width="230" height="70" rx="10" fill="#11142a" stroke="#ff5fa2" stroke-width="2"/><text x="755.0" y="165.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">MIDI-GPT server</text><text x="755.0" y="183.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">infill + track generation</text><rect x="640" y="290" width="230" height="60" rx="10" fill="#11142a" stroke="#4fd1ff" stroke-width="2"/><text x="755.0" y="320.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Synth / sampler</text><text x="755.0" y="338.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">audio out</text><rect x="340" y="360" width="220" height="54" rx="10" fill="#11142a" stroke="#2a2f4a" stroke-width="2"/><text x="450.0" y="387.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Other audio sources</text><text x="450.0" y="405.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">RAVE, Stable Audio, Max (stretch)</text><line x1="240" y1="157" x2="340" y2="220" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="240" y1="227" x2="340" y2="220" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="240" y1="297" x2="340" y2="255" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="560" y1="215" x2="640" y2="170" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="640" y1="185" x2="560" y2="235" stroke="#ff5fa2" stroke-width="1.8" marker-end="url(#a)" /><line x1="450" y1="270" x2="640" y2="310" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="755" y1="350" x2="755" y2="395" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><text x="755" y="415" font-size="12" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="1">speakers</text><polyline points="700,350 700,468 22,468 22,157 38,157" fill="none" stroke="#ffc857" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="360" y="460" font-size="12" fill="#ffc857" text-anchor="middle" font-weight="normal" opacity="1">feedback: output audio becomes new conditioning</text><line x1="450" y1="360" x2="450" y2="272" stroke="#2a2f4a" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="0" y="488" width="960" height="52" fill="#080a14"/><text x="40" y="518" font-size="14" fill="#d8def5" text-anchor="start" font-weight="normal" opacity="1">Core = solid boxes. Stretch = dim box. MIDI-GPT is the main backend.</text></svg>