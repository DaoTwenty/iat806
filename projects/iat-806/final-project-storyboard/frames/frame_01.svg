<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d8def5"/></marker></defs>
<rect width="960" height="540" fill="#0b0d17"/><text x="40" y="48" font-size="34" fill="#ff5fa2" text-anchor="start" font-weight="bold" opacity="1">01</text><text x="92" y="40" font-size="22" fill="#d8def5" text-anchor="start" font-weight="bold" opacity="1">System overview</text><text x="92" y="62" font-size="13" fill="#d8def5" text-anchor="start" font-weight="normal" opacity="0.7">every track is its own pipeline; MIDI-GPT reads and writes tracks</text><rect x="40" y="100" width="170" height="56" rx="10" fill="#11142a" stroke="#4fd1ff" stroke-width="2"/><text x="125.0" y="128.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Audio track</text><text x="125.0" y="146.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">loop · one-shot · stream</text><rect x="260" y="100" width="170" height="56" rx="10" fill="#11142a" stroke="#d8def5" stroke-width="2"/><text x="345.0" y="128.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Audio FX</text><text x="345.0" y="146.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">module (swappable)</text><rect x="40" y="205" width="390" height="60" rx="10" fill="#11142a" stroke="#ff5fa2" stroke-width="2"/><text x="235.0" y="235.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">MIDI-GPT server</text><text x="235.0" y="253.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">audio + MIDI conditioned · track generation + infill</text><rect x="40" y="320" width="170" height="56" rx="10" fill="#11142a" stroke="#4fd1ff" stroke-width="2"/><text x="125.0" y="348.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">MIDI track</text><text x="125.0" y="366.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">drawn / played / generated</text><rect x="260" y="320" width="170" height="56" rx="10" fill="#11142a" stroke="#d8def5" stroke-width="2"/><text x="345.0" y="348.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Synth / sampler</text><text x="345.0" y="366.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">renders MIDI to audio</text><rect x="480" y="320" width="130" height="56" rx="10" fill="#11142a" stroke="#d8def5" stroke-width="2"/><text x="545.0" y="348.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Audio FX</text><text x="545.0" y="366.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">module</text><rect x="680" y="180" width="120" height="160" rx="10" fill="#11142a" stroke="#ffc857" stroke-width="2"/><text x="740.0" y="265.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Mixer</text><rect x="840" y="230" width="90" height="60" rx="10" fill="#11142a" stroke="#d8def5" stroke-width="2"/><text x="885.0" y="265.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Speakers</text><line x1="210" y1="128" x2="260" y2="128" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="430" y1="128" x2="680" y2="215" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="210" y1="348" x2="260" y2="348" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="430" y1="348" x2="480" y2="348" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="610" y1="348" x2="680" y2="300" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="800" y1="260" x2="840" y2="260" stroke="#d8def5" stroke-width="1.8" marker-end="url(#a)" /><line x1="100" y1="156" x2="100" y2="205" stroke="#4fd1ff" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="108" y="186" font-size="11" fill="#4fd1ff" text-anchor="start" font-weight="normal" opacity="1">audio conditioning</text><line x1="80" y1="320" x2="80" y2="265" stroke="#4fd1ff" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="30" y="297" font-size="11" fill="#4fd1ff" text-anchor="start" font-weight="normal" opacity="1">MIDI cond.</text><line x1="150" y1="265" x2="150" y2="320" stroke="#ff5fa2" stroke-width="1.8" marker-end="url(#a)" /><text x="158" y="297" font-size="11" fill="#ff5fa2" text-anchor="start" font-weight="normal" opacity="1">generated MIDI</text><rect x="40" y="410" width="250" height="50" rx="10" fill="#11142a" stroke="#ffc857" stroke-width="2"/><text x="165.0" y="435.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Controls</text><text x="165.0" y="453.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">touchpad · sensors · OCR → any module</text><rect x="340" y="410" width="270" height="50" rx="10" fill="#11142a" stroke="#d8def5" stroke-width="2"/><text x="475.0" y="435.0" font-size="14" fill="#d8def5" text-anchor="middle" font-weight="bold" opacity="1">Visualization (p5.js)</text><text x="475.0" y="453.0" font-size="11" fill="#d8def5" text-anchor="middle" font-weight="normal" opacity="0.7">radial sequencer + particles</text><line x1="290" y1="435" x2="340" y2="435" stroke="#ffc857" stroke-width="1.8" marker-end="url(#a)" /><line x1="740" y1="340" x2="610" y2="425" stroke="#2a2f4a" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="480" y="100" font-size="11" fill="#d8def5" text-anchor="start" font-weight="normal" opacity="0.6">modules: browser synth, Max/MSP, RAVE, Stable Audio …</text><rect x="0" y="488" width="960" height="52" fill="#080a14"/><text x="40" y="518" font-size="14" fill="#d8def5" text-anchor="start" font-weight="normal" opacity="1">Audio plays through its own FX. MIDI must be rendered by a synth. Both meet at the mixer.</text></svg>